name: Add coordinate frame destinations and labels

on:
  workflow_dispatch:
  push:
    paths:
      - .github/scripts/run_coordinate_frame_destinations_and_labels.py

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply implementation
        run: python3 .github/scripts/add_coordinate_frame_destinations_and_labels.py
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build
        run: mvn -B -DskipTests package
      - name: Commit source changes
        run: |
          if git diff --quiet; then
            echo "No source changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/org/server/minerva/ServerPortalFeature.java
          git commit -m "Add coordinate teleporter targets and frame labels"
          git push
