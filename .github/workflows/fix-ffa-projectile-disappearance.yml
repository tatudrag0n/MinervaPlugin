name: Fix FFA projectile disappearance

on:
  push:
    paths:
      - .github/scripts/fix_ffa_projectile_disappearance.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply projectile fixes
        run: python3 .github/scripts/fix_ffa_projectile_disappearance.py

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build
        run: mvn -B -DskipTests package

      - name: Commit source changes
        run: |
          if git diff --quiet; then
            echo "No source changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/org/server/minerva/FfaManager.java src/main/java/org/server/minerva/FfaListener.java
          git commit -m "Fix FFA projectile disappearance"
          git push
