name: Simplify frame destination registration

on:
  push:
    paths:
      - .github/scripts/run_simplify_frame_destination_registration.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  simplify-registration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply simpler frame destination registration
        run: python3 .github/scripts/simplify_frame_destination_registration.py
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build
        run: mvn -B -DskipTests package
      - name: Commit source changes
        run: |
          if git diff --quiet; then
            echo "No source changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/org/server/minerva/ServerPortalFeature.java
          git commit -m "Simplify teleporter frame destination registration"
          git push
