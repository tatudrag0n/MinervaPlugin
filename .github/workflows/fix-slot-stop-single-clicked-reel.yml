name: Fix slot single clicked reel stopping

on:
  push:
    paths:
      - .github/scripts/fix_slot_stop_single_clicked_reel.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply single-reel stop fix
        run: python3 .github/scripts/fix_slot_stop_single_clicked_reel.py
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build
        run: mvn -B -DskipTests package
      - name: Commit source changes
        run: |
          if git diff --quiet; then
            echo "No source changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/org/server/minerva/SlotMachineManager.java
          git commit -m "Stop only the clicked slot reel"
          git push
