name: Fix vampire trident mace and villager debug

"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/fix_vampire_trident_mace_villager_debug.py'
      - '.github/workflows/fix-vampire-trident-mace-villager-debug.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Apply source changes
        run: python3 .github/scripts/fix_vampire_trident_mace_villager_debug.py

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build
        run: mvn -B -DskipTests clean package

      - name: Commit source changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'Rework vampire sustain and add debug target support'
          git push origin HEAD:main
