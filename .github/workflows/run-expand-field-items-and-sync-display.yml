name: Run expanded field-item repair

on:
  push:
    paths:
      - .github/scripts/run_expand_field_items_and_sync_display.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  field-items:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply field-item expansion
        run: python3 .github/scripts/run_expand_field_items_and_sync_display.py
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build
        run: mvn -B -DskipTests package
      - name: Commit source changes
        run: |
          if git diff --quiet; then
            echo "No source changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/org/server/minerva/FfaFieldItemManager.java
          git commit -m "Expand FFA field loot and match display to rewards"
          git push
