name: Build MinervaPlugin

on:
  pull_request:
  push:
    branches:
      - main
      - restore/v15-canonical-source
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify Java
        run: |
          java -version
          javac -version

      - name: Build
        run: mvn -B -DskipTests clean package

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: minervaplugin
          path: |
            target/minervaplugin-*.jar
            !target/original-*.jar
          if-no-files-found: error
          retention-days: 14
