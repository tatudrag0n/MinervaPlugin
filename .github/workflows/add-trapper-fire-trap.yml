name: Add Trapper fire trap

on:
  push:
    paths:
      - .github/scripts/add_trapper_fire_trap.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-fire-trap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fire trap implementation
        run: python3 .github/scripts/add_trapper_fire_trap.py
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build
        run: mvn -B -DskipTests package
      - name: Commit source changes
        run: |
          if git diff --quiet; then
            echo "No source changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/org/server/minerva/FfaConfig.java src/main/java/org/server/minerva/FfaKit.java src/main/java/org/server/minerva/FfaManager.java
          git commit -m "Add fire trap to Trapper kit"
          git push
