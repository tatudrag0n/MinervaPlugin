name: Make Bug Mania immune to all silverfish

on:
  push:
    paths:
      - .github/scripts/make_bug_mania_immune_to_all_silverfish.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-bug-mania:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply all-silverfish immunity
        run: python3 .github/scripts/make_bug_mania_immune_to_all_silverfish.py
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build
        run: mvn -B -DskipTests package
      - name: Commit source changes
        run: |
          if git diff --quiet; then
            echo "No source changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/org/server/minerva/FfaListener.java src/main/java/org/server/minerva/FfaManager.java
          git commit -m "Prevent all silverfish from targeting Bug Mania"
          git push
