name: Fix combat kit regressions

"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/fix_sniper_bugmania_assassin_necromancer.py'
      - '.github/workflows/fix-combat-kit-regressions.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Apply fixes
        run: python3 .github/scripts/fix_sniper_bugmania_assassin_necromancer.py

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build
        run: mvn -B -DskipTests clean package

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'Fix sniper projectile and kit-owned mobs'
          git push origin HEAD:main
