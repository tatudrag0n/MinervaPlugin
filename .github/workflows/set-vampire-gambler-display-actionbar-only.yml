name: Set Vampire and Gambler display to action bar only

on:
  push:
    paths:
      - .github/scripts/set_vampire_gambler_display_actionbar_only.py
      - .github/workflows/set-vampire-gambler-display-actionbar-only.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply display cleanup
        run: python3 .github/scripts/set_vampire_gambler_display_actionbar_only.py
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build
        run: mvn -B -DskipTests package
      - name: Commit source changes
        run: |
          if git diff --quiet; then
            echo "No source changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/org/server/minerva/FfaManager.java
          git commit -m "Show Vampire and Gambler status only in action bar"
          git push
