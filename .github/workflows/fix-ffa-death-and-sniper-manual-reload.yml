name: Fix FFA death state and sniper manual reload

"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-ffa-death-and-sniper-manual-reload.yml
      - .github/scripts/fix_ffa_death_and_sniper_manual_reload.py

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Apply fixes
        run: python3 .github/scripts/fix_ffa_death_and_sniper_manual_reload.py

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build
        run: mvn -B -DskipTests clean package

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Fix FFA death-state lock and require manual sniper reload"
          git push origin HEAD:main
