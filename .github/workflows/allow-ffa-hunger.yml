name: Allow FFA hunger decrease

"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/allow-ffa-hunger.yml'
      - '.github/scripts/allow_ffa_hunger.py'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Apply FFA hunger change
        run: python3 .github/scripts/allow_ffa_hunger.py

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build
        run: mvn -B -DskipTests clean package

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/org/server/minerva/FfaListener.java
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'Allow hunger to decrease during FFA'
          git push origin HEAD:main
