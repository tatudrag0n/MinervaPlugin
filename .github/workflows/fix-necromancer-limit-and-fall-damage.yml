name: Fix necromancer limit and FFA fall damage

"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-necromancer-limit-and-fall-damage.yml'
      - '.github/scripts/fix_necromancer_limit_and_fall_damage.py'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Apply source fixes
        run: python3 .github/scripts/fix_necromancer_limit_and_fall_damage.py

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build with Maven
        run: mvn -B -DskipTests clean package

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java src/main/resources/config.yml
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'Remove necromancer summon limit and disable FFA fall damage'
          git push origin HEAD:main
