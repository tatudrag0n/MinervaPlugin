name: minerva
version: 26.1.2-fixed-v15-inventory-groups

main: org.server.minerva.Minerva
api-version: '1.21'
load: POSTWORLD
softdepend:
  - WorldEdit
commands:
  minerva:
    description: Minerva server management and player utilities.
    usage: /minerva
  mva:
    description: Minerva server management and player utilities.
    usage: /mva
  friend:
    description: Minerva friend system.
    usage: /friend
    aliases: [friends]
  status:
    description: Reset Minerva status data.
    usage: /status <player> reset
  tutorial:
    description: Start the Minerva tutorial.
    usage: /tutorial
permissions:
  minerva.admin:
    description: Allows Minerva administrative commands and protected-area bypass.
    default: op
  minerva.command.use:
    description: Allows basic Minerva commands.
    default: true
  minerva.command.chunk:
    description: Allows /minerva chunk.
    default: true
  minerva.command.protect:
    description: Allows /minerva protect.
    default: true
  minerva.command.status:
    description: Allows /minerva status.
    default: true
  minerva.admin.regen.force:
    default: op
  minerva.reward.grant:
    description: Allows granting Minerva rewards from minigame and athletic completion commands.
    default: op
  minerva.protect.bypass:
    description: Allows bypassing MinerVa protected chunk interaction limits.
    default: op
  minerva.shop.admin:
    description: Allows managing MinerVa shop blocks.
    default: op
  minerva.auction.admin:
    description: Allows managing MinerVa item-frame auctions.
    default: op
  minerva.text.admin:
    description: Allows managing MinerVa TextDisplay guide signs.
    default: op
  minerva.ffa.admin:
    description: Allows managing MinerVa FFA minigame settings and kit stands.
    default: op
  minerva.structure.admin:
    description: Allows managing MinerVa custom structures.
    default: op
  minerva.proposal.admin:
    description: Allows reviewing MinerVa proposals.
    default: op
