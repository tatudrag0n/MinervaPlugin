local-chat-radius: 50.0
hub-protection-radius-chunks: 4
warningDays: 7
regenIntervalDays: 30
backupBeforeRegen: true
customOreGeneration: true
serverSecret: "change-this"
vanillaOreMode: "reduce"

world-rules:
  fixed-day-worlds:
    - athletic
    - minigame
  spawn:
    main:
      world: world
      x: 0.5
      y: 0.0
      z: 0.5
      yaw: 0.0
      pitch: 0.0
    minigame:
      world: minigame
      x: 0.5
      y: 0.0
      z: 0.5
      yaw: 0.0
      pitch: 0.0
  pvp:
    default: false
    enabled-worlds:
      - minigame

shopwand:
  enabled: true
  random-sale:
    mode: "fixed-on-create"
    reroll-minutes: 60
  categories:
    food:
      - bread
      - cooked_beef
      - cooked_porkchop
      - golden_carrot
      - apple
      - potion
      - splash_potion
    combat:
