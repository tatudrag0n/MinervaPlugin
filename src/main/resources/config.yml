auto-shutdown:
  enabled: true
  # Delay in seconds after the last player leaves before stopping the host VM (600 = 10 minutes)
  delay-seconds: 600
  # provider: gcloud (default) or command
  provider: gcloud
  # Used when provider=command
  vm-stop-command: "sudo shutdown -h now"
  gcloud:
    # Optional overrides; empty values are auto-detected from GCE metadata
    instance: ""
    zone: ""
    project: ""
