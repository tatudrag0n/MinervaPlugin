      - poppy
      - dandelion
      - white_dye
      - painting
      - flower_pot
      - lantern
      - chain
      - candle
    material:
      - oak_log
      - spruce_log
      - cobblestone
      - stone
      - iron_ingot
      - gold_ingot
      - copper_ingot
      - coal
      - redstone
      - lapis_lazuli
    drop:
      - bone
      - string
      - rotten_flesh
      - spider_eye
      - gunpowder
      - ender_pearl
      - blaze_rod
    valuables:
      - emerald
      - diamond
      - netherite_ingot
      - enchanted_golden_apple
      - netherite_upgrade_smithing_template
      - heart_of_the_sea
      - elytra
    others: []

discord-auth:
  enabled: true
  require-before-join: true
  code-length: 6
  expire-minutes: 10
  code-characters: "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"
  discord-command: "/verify code:{code}"
  discord-invite: "https://discord.gg/ここに招待URL"
  allow-join-when-auth-system-error: false
  restrict-unverified: true
  restrictions:
    block-break: true
    block-place: true
    chat: false
    command: true
    movement: false
  allowed-commands:
    - "/mva auth"
    - "/mva auth code"
    - "/minerva auth"
    - "/minerva auth code"

structures:
  enabled: true
  worldedit-softdepend: true
  ratio-percent:
    1: 0.2
    2: 0.4
    3: 0.6
    4: 0.8
    5: 1.0
    6: 1.2
    7: 1.4
    8: 1.6
    9: 1.8
